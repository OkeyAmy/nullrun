<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NULLRUN — a stealth roguelite for a human and an agent</title>
    <meta
      name="description"
      content="A turn-based stealth roguelite where an AI agent is your remote handler, acting through WebMCP tools while you move the operative."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1118'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%237df9ff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%237df9ff'/%3E%3C/svg%3E" />
    <!-- Netlify's deploy-preview feedback drawer floats over the action bar; keep it off the board. -->
    <style>
      iframe[title="Netlify Drawer"],
      [data-netlify-deploy-id] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">◈</span>
          <div>
            <h1>NULLRUN</h1>
            <p class="tagline">two minds, one infiltration</p>
          </div>
        </div>
        <div class="stats" id="stats"></div>
        <button id="mute" class="mute" type="button" aria-pressed="false" title="Toggle sound">
          <span aria-hidden="true">♪</span><span class="mute-label">Sound</span>
        </button>
        <div class="bridge" id="bridge-status"></div>
      </header>

      <main class="layout">
        <section class="stage">
          <div class="canvas-wrap">
            <canvas id="board"></canvas>
          </div>
          <div class="route-info" id="route-info" data-testid="route-info" aria-live="polite">Hover a tile to preview the route.</div>
          <div class="actionbar" id="actionbar"></div>
        </section>

        <aside class="sidebar">
          <section class="panel">
            <h2>Handler console</h2>
            <div class="log" id="log"></div>
          </section>
          <section class="panel">
            <h2>Agent tools <span class="count" id="tool-count"></span></h2>
            <p class="hint" id="tool-hint"></p>
            <ul class="tools" id="tools"></ul>
          </section>
        </aside>
      </main>

      <div class="overlay" id="overlay" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
