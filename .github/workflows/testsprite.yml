name: TestSprite

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: testsprite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: UI suite
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # Fork PRs cannot read repository secrets — skip instead of failing red.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # Actions pinned to full commit SHAs so every run executes exactly what was reviewed.
      - name: Run the TestSprite UI suite
        uses: TestSprite/testsprite-action@9f3ac52a42baae6c7099d1f89fa603b31d636d63 # v1.0.0
        with:
          api-key: ${{ secrets.TESTSPRITE_API_KEY }}
          project: "9f2ff1bd-24e6-4c98-9511-4f9ebc60be4d"
          cli-version: "0.13.0"
          node-version: "22"
          timeout: "1800"
