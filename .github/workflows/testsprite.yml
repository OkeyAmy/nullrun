name: TestSprite

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: testsprite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: UI suite
    runs-on: ubuntu-latest
    timeout-minutes: 55
    # Fork PRs cannot read repository secrets — skip instead of failing red.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      # Run the TestSprite UI suite via test list (deterministic stored-code tests)
      - name: Run the TestSprite UI suite
        run: |
          npx -y @testsprite/testsprite-cli@0.13.0 testlist run 39eb38d6-01dd-486b-ae5f-11124b657bbd \
            --wait --report junit --report-file testsprite-junit.xml \
            --timeout 1800
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testsprite-junit
          path: testsprite-junit.xml
          if-no-files-found: ignore